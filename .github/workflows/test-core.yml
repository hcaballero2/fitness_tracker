name: Test FitnessCore

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        working-directory: Packages/FitnessCore
        run: swift test
