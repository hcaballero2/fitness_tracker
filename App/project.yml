# XcodeGen spec — the Xcode project is generated from this file in CI.
# Never commit a .xcodeproj; edit this instead.
name: FitnessTracker
options:
  # [assumption] neutral personal-project bundle prefix — change freely before first install;
  # changing it AFTER installing loses on-device data (new app container).
  bundleIdPrefix: dev.hazelcaballero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FitnessCore:
    path: ../Packages/FitnessCore

targets:
  FitnessTracker:
    type: application
    platform: iOS
    sources:
      - FitnessTracker
    dependencies:
      - package: FitnessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hazelcaballero.fitnesstracker
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
